<div class="search-container mb-4">
  <h3 class="text-danger"><i class="bi bi-shield-shaded"></i> Analizar Rival</h3>
  <div class="input-group">
    <input type="text" class="form-control" placeholder="Nombre del rival (ej: gengar)" 
           [(ngModel)]="searchName" (keyup.enter)="buscarRival()">
    <button class="btn btn-danger" type="button" (click)="buscarRival()">
      <i class="bi bi-search"></i> Buscar
    </button>
  </div>
</div>

<div class="card bg-dark text-white border-0 shadow" *ngIf="pokemon">
  <div class="row g-0 align-items-center">
    <div class="col-md-4 text-center p-3">
      <img [src]="pokemon.imageUrl" class="img-fluid rounded-start pokemon-img" [alt]="pokemon.name">
    </div>
    <div class="col-md-8">
      <div class="card-body">
        <h2 class="card-title text-capitalize">{{ pokemon.name }}</h2>
        <div class="d-flex gap-2">
          <span class="badge text-uppercase" [ngClass]="'type-' + pokemon.type1">{{ pokemon.type1 }}</span>
          <span class="badge text-uppercase" *ngIf="pokemon.type2" [ngClass]="'type-' + pokemon.type2">{{ pokemon.type2 }}</span>
        </div>
        
        <hr class="border-secondary">
        
        <h6>Movimientos conocidos:</h6>
        <ul class="list-inline">
          <li class="list-inline-item badge bg-secondary" *ngFor="let move of pokemon.moves">
            {{ move.name }}
          </li>
        </ul>
      </div>
    </div>
  </div>
</div>
